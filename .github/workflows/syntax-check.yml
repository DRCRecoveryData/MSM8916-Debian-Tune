name: Shell syntax check

on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Syntax check
        run: |
          for f in *.sh; do
            echo "checking $f"
            bash -n "$f"
            shellcheck "$f" || true
          done
